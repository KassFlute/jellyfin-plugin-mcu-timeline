name: Release

# publish a GitHub release tagged with the release number (1.1.0 or v1.1.0): one zip per
# Jellyfin version is attached to it, and manifest.json on main gets them all, which is what
# Jellyfin servers read. Each server installs the newest build its version can run
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Release number from the tag
        id: version
        run: |
          tag='${{ github.event.release.tag_name }}'
          tag="${tag#v}"
          # the fourth part is the Jellyfin minor, added below
          echo "version=$(echo "$tag" | cut -d. -f1-3)" >> "$GITHUB_OUTPUT"

      - name: Build one zip per Jellyfin version
        run: |
          pip install --quiet jprm
          mkdir -p dist
          for abi in 10.9 10.10 10.11 12; do
            # JPRM rewrites the csproj and cleans without restoring, so each build starts
            # from a clean tree: a restore left for another framework fails the clean
            git checkout -- .
            git clean -fdxq -- src
            case "$abi" in
              12) framework=net10.0; target_abi=12.0.0.0 ;;
              10.11) framework=net9.0; target_abi=10.11.0.0 ;;
              *) framework=net8.0; target_abi=$abi.0.0 ;;
            esac
            sed -i -E "s/^targetAbi: .*/targetAbi: \"$target_abi\"/; s/^framework: .*/framework: \"$framework\"/" build.yaml
            # JellyfinAbi reaches MSBuild as a property, it picks the packages to build against
            JellyfinAbi="$abi" jprm plugin build . \
              --version="${{ steps.version.outputs.version }}.${abi#10.}" \
              --dotnet-framework="$framework" --output=dist
          done
          ls dist

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.zip --clobber

      - name: Add the versions to manifest.json
        run: |
          # the builds stamp build.yaml and Directory.Build.props, only the manifest is committed
          git checkout -- .
          for artifact in dist/*.zip; do
            jprm repo add \
              --plugin-url="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/$(basename "$artifact")" \
              ./manifest.json "$artifact"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "Publish MCU Timeline ${{ steps.version.outputs.version }}"
          git push origin main
