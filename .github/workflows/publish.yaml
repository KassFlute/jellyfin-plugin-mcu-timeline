name: '🚀 Publish'

on:
  release:
    types:
      - released

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish release and update the plugin repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # a tag may or may not carry a leading v, the version written into the assembly and the
      # manifest never does
      - name: Read the version from the tag
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net10.0
          version: ${{ steps.version.outputs.version }}

      # JPRM leaves its own sidecars next to the zip, so the assets are staged in a
      # directory of their own rather than globbed from the build output
      - name: Stage the release assets
        id: assets
        run: |
          artifact='${{ steps.jprm.outputs.artifact }}'
          filename="$(basename "${artifact}")"
          mkdir -p release-assets
          cp "${artifact}" release-assets/
          cd release-assets
          md5sum "${filename}" > "${filename}.md5"
          sha256sum "${filename}" > "${filename}.sha256"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      - name: Attach assets to the release
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release-assets/*

      # the manifest is what a Jellyfin server reads, so it has to point at the release asset
      # that was just published rather than at anything inside this repository
      - name: Add the release to the plugin repository manifest
        run: |
          python3 -m pip install --upgrade jprm
          # the build writes the released version into Directory.Build.props, so the tree is
          # dirty here and the branch switch has to start from a clean one
          git checkout -- .
          git fetch origin main
          git checkout main
          # the path needs its directory component, jprm rejects a bare file name
          jprm --verbosity=debug repo add \
            --plugin-url='https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/${{ steps.assets.outputs.filename }}' \
            ./manifest.json \
            '${{ steps.jprm.outputs.artifact }}'

      # main only takes pull requests, servers see the version once this one is merged
      - name: Open the manifest pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="publish-${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          git add manifest.json
          git commit -m "Publish MCU Timeline ${VERSION}"
          git push -f origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "Publish MCU Timeline ${VERSION}" \
            --body "Adds ${VERSION} to the plugin repository manifest. Jellyfin servers only see the release once this is merged." \
            --label release-prep --label skip-changelog
