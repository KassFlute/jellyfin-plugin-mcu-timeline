name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # 10 builds every target, the tests run on 9
          dotnet-version: |
            9.0.x
            10.0.x

      # kept out of the solution so JPRM packages the plugin alone
      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.McuTimeline.Tests

      # every Jellyfin version the release ships for must still compile
      - name: Build for Jellyfin 10.9, 10.10 and 12
        run: |
          for abi in 10.9 10.10 12; do
            dotnet build src/Jellyfin.Plugin.McuTimeline -c Release -p:JellyfinAbi=$abi
          done

      - name: Build
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net9.0

      - uses: actions/upload-artifact@v7
        with:
          name: mcu-timeline
          path: ${{ steps.jprm.outputs.artifact }}
