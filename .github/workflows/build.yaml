name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # kept out of the solution so JPRM packages the plugin alone
      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.McuTimeline.Tests

      - name: Build
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net9.0

      - uses: actions/upload-artifact@v7
        with:
          name: mcu-timeline
          path: ${{ steps.jprm.outputs.artifact }}
