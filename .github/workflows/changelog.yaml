name: '📝 Draft the next release'

on:
  push:
    branches:
      - main
    # the release preparation and the publish workflow write these, reacting to them would
    # loop
    paths-ignore:
      - build.yaml
      - CHANGELOG.md
      - manifest.json
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  label:
    name: Label the pull request
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  draft:
    name: Draft the release and prepare the bump
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update the release draft
        id: draft
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the draft body is the single source. It is stripped down to the headings and the
      # entries, which is what both the plugin catalogue and CHANGELOG.md carry
      - name: Read the draft
        id: entry
        env:
          DRAFT_BODY: ${{ steps.draft.outputs.body }}
          DRAFT_TAG: ${{ steps.draft.outputs.tag_name }}
        run: |
          python3 - <<'PY'
          import os, re
          out = []
          for line in os.environ['DRAFT_BODY'].splitlines():
              if line.startswith('###'):
                  out.append('\n' + re.sub(r'^(#+)\s*(:[\w+-]+:)?\s*', r'\1 ', line))
              elif line.startswith(('- ', '* ')):
                  out.append('- ' + line[2:])
          text = '\n'.join(out).strip()
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'entry.md'), 'w') as f:
              f.write(text + '\n' if text else '')
          PY
          version="${DRAFT_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if grep -q '^- ' "${RUNNER_TEMP}/entry.md"; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the version and the changelog
        if: steps.entry.outputs.has-changes == 'true'
        env:
          VERSION: ${{ steps.entry.outputs.version }}
        run: |
          # targetAbi stays hand written, it says which servers can install the plugin, not
          # which one built it
          CHANGELOG="$(cat "${RUNNER_TEMP}/entry.md")" yq eval \
            '.version = strenv(VERSION) | .changelog = strenv(CHANGELOG) | .changelog style="literal"' \
            -i build.yaml
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['VERSION']
          entry = open(os.path.join(os.environ['RUNNER_TEMP'], 'entry.md')).read().strip()
          path = pathlib.Path('CHANGELOG.md')
          text = path.read_text()
          # the draft is rebuilt on every merge, so an entry for this version may already be
          # there from an earlier run
          text = re.sub(r'\n## %s\n.*?(?=\n## |\Z)' % re.escape(version), '', text, flags=re.S)
          head, sep, rest = text.partition('\n## ')
          path.write_text('%s\n\n## %s\n\n%s\n%s' % (head.rstrip('\n'), version, entry, sep + rest if sep else '\n'))
          PY

      - name: Open or update the release preparation pull request
        if: steps.entry.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.entry.outputs.version }}
        run: |
          if git diff --quiet; then
            echo 'build.yaml and CHANGELOG.md are already up to date'
            exit 0
          fi
          gh label create release-prep --color e0e0e0 --force \
            --description 'Generated pull request that bumps the version and the changelog'
          gh label create skip-changelog --color e0e0e0 --force \
            --description 'Left out of the release draft'
          branch="prepare-${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          git commit -am "Prepare MCU Timeline ${VERSION}"
          git push -f origin "${branch}"
          {
            echo 'Generated from the release draft. Merge it before publishing the draft, the'
            echo 'plugin catalogue reads its changelog from `build.yaml`.'
            echo
            cat "${RUNNER_TEMP}/entry.md"
          } > "${RUNNER_TEMP}/body.md"
          gh pr edit "${branch}" --title "Prepare MCU Timeline ${VERSION}" \
            --body-file "${RUNNER_TEMP}/body.md" \
          || gh pr create --base main --head "${branch}" \
            --title "Prepare MCU Timeline ${VERSION}" \
            --body-file "${RUNNER_TEMP}/body.md" \
            --label release-prep --label skip-changelog
