name: Feature request
description: Suggest something the plugin should do
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation you are in, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like instead
