<!DOCTYPE html>
<html>
<head>
    <title>MCU Timeline</title>
</head>
<body>
<div id="McuTimelineConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-checkbox,emby-select">
    <style>
        .mcuTable { width: 100%; border-collapse: collapse; }
        .mcuTable th { text-align: left; padding: .4em .8em .4em 0; font-weight: 600; }
        .mcuTable td { padding: .5em .8em .5em 0; }
        .mcuTable tr + tr td { border-top: 1px solid rgba(255, 255, 255, .12); }
        .mcuFacts { display: grid; grid-template-columns: max-content 1fr; gap: .4em 1.2em; margin: 0; }
        .mcuFacts dt { opacity: .7; }
        .mcuFacts dd { margin: 0; word-break: break-all; }
        .mcuError { color: #ff6b6b; }
        .mcuActions { display: flex; flex-wrap: wrap; gap: .6em; margin-top: 1.2em; }
        .mcuActions .emby-button { margin: 0; }
        .mcuLibraries { margin-left: 2em; }
    </style>

    <div data-role="content">
        <div class="content-primary">

            <div class="verticalSection">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle" data-i18n="status"></h2>
                </div>
                <dl class="mcuFacts">
                    <dt data-i18n="data"></dt><dd id="McuDataVersion">…</dd>
                    <dt data-i18n="override"></dt><dd id="McuOverridePath">…</dd>
                    <dt data-i18n="found"></dt><dd id="McuFound">…</dd>
                    <dt data-i18n="lastSync"></dt><dd id="McuLastSync">…</dd>
                </dl>
                <p id="McuOverrideError" class="mcuError" hidden></p>
                <p id="McuSyncError" class="mcuError" hidden></p>
                <div class="mcuActions">
                    <button is="emby-button" type="button" id="McuSyncButton" class="raised button-submit emby-button">
                        <span data-i18n="syncNow"></span>
                    </button>
                    <button is="emby-button" type="button" id="McuOpenButton" class="raised emby-button">
                        <span data-i18n="open"></span>
                    </button>
                </div>
            </div>

            <div class="verticalSection">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle" data-i18n="missingTitle"></h2>
                </div>
                <p id="McuMissingEmpty" data-i18n="missingNone" hidden></p>
                <table class="mcuTable" id="McuMissingTable" hidden>
                    <thead><tr><th data-i18n="colTitle"></th><th data-i18n="colType"></th><th>tmdbId</th><th>imdbId</th></tr></thead>
                    <tbody id="McuMissing"></tbody>
                </table>
                <div class="fieldDescription" data-i18n="missingHelp"></div>
            </div>

            <form id="McuSettingsForm" class="verticalSection">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle" data-i18n="settings"></h2>
                </div>

                <div class="checkboxContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="McuAllLibraries">
                        <span data-i18n="allLibraries"></span>
                    </label>
                </div>
                <div id="McuLibraries" class="mcuLibraries"></div>

                <div class="checkboxContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="McuIncludeShorts">
                        <span data-i18n="includeShorts"></span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="McuIncludeUpcoming">
                        <span data-i18n="includeUpcoming"></span>
                    </label>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="McuEnablePlaylists">
                        <span data-i18n="enablePlaylists"></span>
                    </label>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="McuShowInPluginPages">
                        <span data-i18n="showInMenu"></span>
                    </label>
                    <div class="fieldDescription checkboxFieldDescription" data-i18n="showInMenuHelp"></div>
                </div>

                <div class="inputContainer">
                    <input is="emby-input" type="url" id="McuJellyseerrUrl" data-i18n-label="seerrUrl" placeholder="https://jellyseerr.example.com">
                    <div class="fieldDescription" data-i18n="seerrUrlHelp"></div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="password" id="McuJellyseerrApiKey" data-i18n-label="seerrKey" autocomplete="off">
                    <div class="fieldDescription" data-i18n="seerrKeyHelp"></div>
                </div>

                <div class="selectContainer">
                    <select is="emby-select" id="McuOwner" data-i18n-label="owner"></select>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="text" id="McuReleaseName" data-i18n-label="releaseName">
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="text" id="McuChronoName" data-i18n-label="chronoName">
                    <div class="fieldDescription" data-i18n="namesHelp"></div>
                </div>

                <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                    <span data-i18n="save"></span>
                </button>
            </form>

        </div>
    </div>

    <script type="text/javascript">
        (function () {
            var pluginId = '7de48f79-4cdb-453f-8ce9-bd22c9e84f6a';
            var page = document.querySelector('#McuTimelineConfigPage');
            var $ = function (id) { return page.querySelector('#' + id); };

            var STRINGS = {
                en: {
                    status: 'Status', data: 'Data', override: 'Local override', found: 'Titles found', lastSync: 'Last synchronisation',
                    syncNow: 'Synchronise the playlists now', open: 'Open the timeline',
                    missingTitle: 'Titles not found', missingNone: 'Every released title is in the library.',
                    colTitle: 'Title', colType: 'Type',
                    missingHelp: 'Titles are matched by tmdbId, then imdbId. Fix the ids in the item metadata, then synchronise.',
                    settings: 'Settings', allLibraries: 'All movie and show libraries', includeShorts: 'Include shorts',
                    includeUpcoming: 'Include upcoming titles', enablePlaylists: 'Keep the playlists',
                    showInMenu: 'Show the timeline under Media in the side menu',
                    showInMenuHelp: 'Needs the Plugin Pages and File Transformation plugins. Applies the next time the web client loads.',
                    seerrUrl: 'Jellyseerr address', seerrUrlHelp: 'Leave empty to hide the request button.',
                    seerrKey: 'Jellyseerr API key',
                    seerrKeyHelp: 'Jellyseerr settings, General. Requests are made as the Jellyseerr user linked to the Jellyfin account, with its rights and quota.',
                    owner: 'Playlist owner', firstAdmin: 'First administrator',
                    releaseName: 'Release order playlist name', chronoName: 'Story order playlist name',
                    namesHelp: 'Leave empty for a name in the server language.',
                    save: 'Save', never: 'never', embedded: 'embedded', overrideActive: 'local override', overrideMissing: 'none',
                    upcoming: '{n} upcoming, not counted', overrideError: 'Local override ignored: {e}',
                    syncError: 'Last synchronisation failed: {e}', loadFailed: 'Could not load: {e}',
                    saveFailed: 'Could not save: {e}', synced: 'Playlists synchronised.', syncFailed: 'Could not synchronise: {e}'
                },
                fr: {
                    status: 'État', data: 'Données', override: 'Surcharge locale', found: 'Titres trouvés', lastSync: 'Dernière synchronisation',
                    syncNow: 'Synchroniser les playlists maintenant', open: 'Ouvrir la timeline',
                    missingTitle: 'Titres non trouvés', missingNone: 'Tous les titres sortis sont dans la bibliothèque.',
                    colTitle: 'Titre', colType: 'Type',
                    missingHelp: "Le rapprochement se fait par tmdbId, puis imdbId. Corrigez les identifiants dans les métadonnées de l'élément, puis synchronisez.",
                    settings: 'Réglages', allLibraries: 'Toutes les bibliothèques Films et Séries', includeShorts: 'Inclure les courts métrages',
                    includeUpcoming: 'Inclure les titres à venir', enablePlaylists: 'Activer les playlists',
                    showInMenu: 'Afficher la timeline sous Médias dans le menu latéral',
                    showInMenuHelp: 'Nécessite les plugins Plugin Pages et File Transformation. Prend effet au prochain chargement du client web.',
                    seerrUrl: 'Adresse de Jellyseerr', seerrUrlHelp: 'Laissez vide pour masquer le bouton Demander.',
                    seerrKey: 'Clé API de Jellyseerr',
                    seerrKeyHelp: "Réglages Jellyseerr, Général. Les demandes sont faites au nom de l'utilisateur Jellyseerr lié au compte Jellyfin, avec ses droits et son quota.",
                    owner: 'Propriétaire des playlists', firstAdmin: 'Premier administrateur',
                    releaseName: 'Nom de la playlist en ordre de sortie', chronoName: 'Nom de la playlist en ordre chronologique',
                    namesHelp: 'Laissez vide pour un nom dans la langue du serveur.',
                    save: 'Enregistrer', never: 'jamais', embedded: 'embarquées', overrideActive: 'surcharge locale', overrideMissing: 'absente',
                    upcoming: '{n} à venir, non comptés', overrideError: 'Surcharge locale ignorée : {e}',
                    syncError: 'Échec de la dernière synchronisation : {e}', loadFailed: 'Chargement impossible : {e}',
                    saveFailed: 'Enregistrement impossible : {e}', synced: 'Playlists synchronisées.', syncFailed: 'Synchronisation impossible : {e}'
                }
            };

            // the dashboard puts its display language on <html lang>
            var language = document.documentElement.lang || 'en';
            var T = STRINGS[language.split('-')[0].toLowerCase()] || STRINGS.en;

            function t(key, values) {
                return T[key].replace(/\{(\w+)\}/g, function (match, name) {
                    return values && values[name] !== undefined ? values[name] : match;
                });
            }

            function translate() {
                Array.prototype.forEach.call(page.querySelectorAll('[data-i18n]'), function (el) {
                    el.textContent = t(el.getAttribute('data-i18n'));
                });
                Array.prototype.forEach.call(page.querySelectorAll('[data-i18n-label]'), function (el) {
                    var text = t(el.getAttribute('data-i18n-label'));
                    el.setAttribute('label', text);
                    // emby-input and emby-select copy the attribute into a label once upgraded
                    var label = page.querySelector('label[for="' + el.id + '"]');
                    if (label) {
                        label.textContent = text;
                    }
                });
            }

            function apiUrl(path) {
                return ApiClient.getUrl(path, { language: language });
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function formatDate(iso) {
                if (!iso) {
                    return t('never');
                }
                // the server sends UTC without a zone marker
                var date = new Date(/Z|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + 'Z');
                return date.toLocaleString(language);
            }

            function describeError(error) {
                return error && error.status ? 'HTTP ' + error.status : String(error);
            }

            function showStatus(status) {
                var override = status.DataSource === 'override';
                $('McuDataVersion').textContent = status.DataVersion + ' (' + t(override ? 'overrideActive' : 'embedded') + ')';
                $('McuOverridePath').textContent = status.OverridePath + (override ? '' : ' (' + t('overrideMissing') + ')');
                $('McuFound').textContent = status.Found + ' / ' + status.Total
                    + (status.Upcoming ? ' (+ ' + t('upcoming', { n: status.Upcoming }) + ')' : '');
                $('McuLastSync').textContent = formatDate(status.LastSyncUtc);

                $('McuOverrideError').hidden = !status.OverrideError;
                $('McuOverrideError').textContent = status.OverrideError ? t('overrideError', { e: status.OverrideError }) : '';
                $('McuSyncError').hidden = !status.LastSyncError;
                $('McuSyncError').textContent = status.LastSyncError ? t('syncError', { e: status.LastSyncError }) : '';

                var missing = status.Missing || [];
                $('McuMissingEmpty').hidden = missing.length > 0;
                $('McuMissingTable').hidden = missing.length === 0;
                $('McuMissing').innerHTML = missing.map(function (m) {
                    return '<tr><td>' + escapeHtml(m.Title) + '</td><td>' + escapeHtml(m.Type)
                        + '</td><td>' + escapeHtml(m.TmdbId) + '</td><td>' + escapeHtml(m.ImdbId || '') + '</td></tr>';
                }).join('');
            }

            function loadStatus() {
                return ApiClient.getJSON(apiUrl('McuTimeline/status')).then(showStatus);
            }

            function renderLibraries(folders, selected) {
                var candidates = folders.filter(function (f) {
                    return f.CollectionType === 'movies' || f.CollectionType === 'tvshows' || !f.CollectionType || f.CollectionType === 'mixed';
                });
                $('McuLibraries').innerHTML = candidates.map(function (f) {
                    var checked = selected.indexOf(f.ItemId) >= 0 ? ' checked' : '';
                    return '<div class="checkboxContainer"><label><input is="emby-checkbox" type="checkbox" class="mcuLibrary" value="'
                        + escapeHtml(f.ItemId) + '"' + checked + '><span>' + escapeHtml(f.Name) + '</span></label></div>';
                }).join('');
            }

            function applyAllLibraries() {
                $('McuLibraries').hidden = $('McuAllLibraries').checked;
            }

            function renderOwners(users, ownerId) {
                var admins = users.filter(function (u) { return u.Policy && u.Policy.IsAdministrator; });
                $('McuOwner').innerHTML = '<option value="">' + escapeHtml(t('firstAdmin')) + '</option>' + admins.map(function (u) {
                    return '<option value="' + escapeHtml(u.Id) + '">' + escapeHtml(u.Name) + '</option>';
                }).join('');
                $('McuOwner').value = ownerId || '';
            }

            function loadSettings() {
                return Promise.all([
                    ApiClient.getPluginConfiguration(pluginId),
                    ApiClient.getVirtualFolders(),
                    ApiClient.getUsers()
                ]).then(function (results) {
                    var config = results[0];
                    var selected = config.LibraryIds || [];
                    $('McuAllLibraries').checked = selected.length === 0;
                    renderLibraries(results[1] || [], selected);
                    applyAllLibraries();
                    $('McuIncludeShorts').checked = config.IncludeShorts;
                    $('McuIncludeUpcoming').checked = config.IncludeUpcoming;
                    $('McuEnablePlaylists').checked = config.EnablePlaylists;
                    renderOwners(results[2] || [], config.PlaylistOwnerId);
                    $('McuReleaseName').value = config.ReleasePlaylistName || '';
                    $('McuChronoName').value = config.ChronologicalPlaylistName || '';
                    $('McuShowInPluginPages').checked = config.ShowInPluginPages;
                    $('McuJellyseerrUrl').value = config.JellyseerrUrl || '';
                    $('McuJellyseerrApiKey').value = config.JellyseerrApiKey || '';
                });
            }

            translate();

            page.addEventListener('viewshow', function () {
                translate();
                Dashboard.showLoadingMsg();
                Promise.all([loadSettings(), loadStatus()]).catch(function (error) {
                    Dashboard.alert(t('loadFailed', { e: describeError(error) }));
                }).then(function () {
                    Dashboard.hideLoadingMsg();
                });
            });

            $('McuAllLibraries').addEventListener('change', applyAllLibraries);

            $('McuSettingsForm').addEventListener('submit', function (event) {
                event.preventDefault();
                Dashboard.showLoadingMsg();
                // read again just before saving, the sync writes its own fields meanwhile
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    config.LibraryIds = $('McuAllLibraries').checked ? [] : Array.prototype.map.call(
                        page.querySelectorAll('.mcuLibrary:checked'), function (input) { return input.value; });
                    config.IncludeShorts = $('McuIncludeShorts').checked;
                    config.IncludeUpcoming = $('McuIncludeUpcoming').checked;
                    config.EnablePlaylists = $('McuEnablePlaylists').checked;
                    config.PlaylistOwnerId = $('McuOwner').value;
                    config.ReleasePlaylistName = $('McuReleaseName').value.trim();
                    config.ChronologicalPlaylistName = $('McuChronoName').value.trim();
                    config.ShowInPluginPages = $('McuShowInPluginPages').checked;
                    config.JellyseerrUrl = $('McuJellyseerrUrl').value.trim();
                    config.JellyseerrApiKey = $('McuJellyseerrApiKey').value.trim();
                    return ApiClient.updatePluginConfiguration(pluginId, config);
                }).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    return loadStatus();
                }).catch(function (error) {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert(t('saveFailed', { e: describeError(error) }));
                });
                return false;
            });

            $('McuSyncButton').addEventListener('click', function () {
                Dashboard.showLoadingMsg();
                ApiClient.ajax({
                    type: 'POST',
                    url: apiUrl('McuTimeline/sync'),
                    dataType: 'json'
                }).then(function (status) {
                    showStatus(status);
                    Dashboard.hideLoadingMsg();
                    if (!status.LastSyncError) {
                        Dashboard.alert(t('synced'));
                    }
                }, function (error) {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert(t('syncFailed', { e: describeError(error) }));
                });
            });

            $('McuOpenButton').addEventListener('click', function () {
                location.hash = '#/userpluginsettings.html?pageUrl=/McuTimeline/page';
            });
        })();
    </script>
</div>
</body>
</html>
